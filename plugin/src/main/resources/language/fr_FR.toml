description = "Autorise à casser des blocs sur l'île."

[island.permission.block_interact]
name = "Interagir avec les blocs"
description = "Autorise à utiliser les leviers, boutons, portes, etc."

[island.permission.block_physical]
name = "Interactions physiques"
description = "Autorise les interactions physiques (plaques de pression, etc.)."

[island.permission.block_place]
name = "Poser des blocs"
description = "Autorise à placer des blocs sur l'île."

[island.permission.block_use_bucket]
name = "Utiliser des seaux"
description = "Autorise à vider ou remplir des seaux sur l'île."

[island.permission.decor_hanging_break]
name = "Décrocher des décorations"
description = "Autorise à retirer des cadres et tableaux."

[island.permission.decor_hanging_place]
name = "Accrocher des décorations"
description = "Autorise à placer des cadres et tableaux."

[island.permission.entity_breed]
name = "Reproduire des animaux"
description = "Autorise à faire se reproduire des animaux sur l'île."

[island.permission.entity_damage]
name = "Attaquer des entités"
description = "Autorise à infliger des dégâts aux entités sur l'île."

[island.permission.entity_interact]
name = "Interagir avec les entités"
description = "Autorise à interagir avec les entités (marchands, animaux, etc.)."

[island.permission.inventory_modify]
name = "Modifier un inventaire"
description = "Autorise à déplacer des objets dans les conteneurs."

[island.permission.inventory_open]
name = "Ouvrir des conteneurs"
description = "Autorise à ouvrir les coffres et autres conteneurs."

[island.permission.item_drop]
name = "Jeter des objets"
description = "Autorise à lâcher des objets au sol sur l'île."

[island.permission.item_pickup]
name = "Ramasser des objets"
description = "Autorise à ramasser des objets au sol sur l'île."

[island.permission.player_teleport]
name = "Se téléporter sur l'île"
description = "Autorise la téléportation vers une île privée."

