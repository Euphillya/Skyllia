description = "Autorise à augmenter le grade d'un membre de l'île."

[island.permission.command.set_biome]
name = "Changer le biome"
description = "Autorise à modifier le biome de l'île ou d'un chunk."

[island.permission.command.set_home]
name = "Définir le home"
description = "Autorise à déplacer le point de retour principal de l'île."

[island.permission.command.set_warp]
name = "Créer un warp"
description = "Autorise à créer ou modifier un warp sur l'île."

