name: Build Skyllia 3.x
on:
  push:
    branches:
      - ver/3.x

permissions: write-all

jobs:
  skyllia-dev:
    runs-on: ubuntu-22.04
    if: "!contains(github.event.commits[0].message, '[ci-skip]')"
    steps:
      - name: Checkout Git Repository
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          cache: "gradle"
          distribution: "temurin"

      - name: Configure Git User
        run: git config --global user.email "actions@github.com" && git config --global user.name "Github Actions"

      - name: Permission gradlew
        run: chmod +x gradlew

      - name: Build Skyllia jar
        run: ./gradlew shadowJar

      - name: Collect jars
        run: |
          mkdir -p release
          cp build/libs/*.jar release/ || true
          cp addons/*/build/libs/*.jar release/ || true
          rm -f release/addons-*.jar

      - name: Upload Snapshot jar
        uses: actions/upload-artifact@v4
        with:
          name: Skyllia-Build
          path: release/*.jar

      - name: Publish to Modrinth (Gradle Minotaur)
        if: github.event_name != 'pull_request' || (github.event.pull_request.number == 94 && github.event.pull_request.head.repo.full_name == github.repository)
        run: ./gradlew modrinth

      - name: Create Release
        if: github.event_name != 'pull_request' || (github.event.pull_request.number == 94 && github.event.pull_request.head.repo.full_name == github.repository)
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.tag }}
          name: ${{ env.project_id_b }} - ${{ github.run_number }}
          body: |
            This release is automatically compiled by GitHub Actions
            ### Commit Message
            ${{ env.commit_msg }}
          artifacts: release/*.jar
          generateReleaseNotes: true
          prerelease: ${{ env.pre }}
          makeLatest: ${{ env.make_latest }}
          token: ${{ secrets.GITHUB_TOKEN }}
          replacesArtifacts: false

env:
  tag: build-ver3.x-${{ github.run_number }}
  project_id_b: Skyllia
  commit_id: ${{ github.sha }}
  commit_msg: ${{ github.event.head_commit.message }}
  MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
  pre: false
  make_latest: true
