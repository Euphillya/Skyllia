name: Build Skyllia (Stable)
on:
  push:
    branches:
      - ver/2.x

permissions: write-all

env:
  project_id_b: Skyllia
  commit_id: ${{ github.sha }}
  commit_msg: ${{ github.event.head_commit.message }}
  MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-22.04
    if: "!contains(github.event.commits[0].message, '[ci-skip]')"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          cache: "gradle"
          distribution: "temurin"

      - name: Configure Git User
        run: git config --global user.email "actions@github.com" && git config --global user.name "Github Actions"

      - name: Permission gradlew
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew shadowJar

      - name: Collect jars
        run: |
          mkdir -p release
          cp build/libs/*.jar release/ || true
          cp addons/*/build/libs/*.jar release/ || true
          rm -f release/addons-*.jar

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Skyllia-Stable
          path: release/*.jar

      - name: Publish to Modrinth
        run: ./gradlew modrinth

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: build-${{ github.ref_name }}-${{ github.run_number }}
          name: Skyllia - ${{ github.ref_name }} - ${{ github.run_number }}
          body: |
            This release is automatically compiled by GitHub Actions
            ### Commit Message
            ${{ env.commit_msg }}
          artifacts: release/*.jar
          generateReleaseNotes: true
          prerelease: false
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
          replacesArtifacts: false
